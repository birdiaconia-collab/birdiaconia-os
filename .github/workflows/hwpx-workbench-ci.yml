name: HWPX Workbench Build Check
on:
  pull_request:
    paths:
      - "lib/hwpx-workbench.ts"
      - "app/ops/documents/**"
      - "tests/hwpx-workbench.test.mjs"
      - "package.json"
      - ".github/workflows/hwpx-workbench-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Runtime versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: HWPX unit tests
        run: npm test
      - name: Full Next.js production build
        run: npm run build
