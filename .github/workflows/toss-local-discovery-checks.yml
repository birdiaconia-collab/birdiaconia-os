name: Toss local discovery checks
on:
  pull_request:
    paths:
      - "apps/toss-local-discovery/**"
      - "docs/toss/**"
      - ".github/workflows/toss-local-discovery-checks.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm run test
        working-directory: apps/toss-local-discovery
      - run: npm install --no-audit --no-fund
        working-directory: apps/toss-local-discovery
      - run: npm run build
        working-directory: apps/toss-local-discovery
