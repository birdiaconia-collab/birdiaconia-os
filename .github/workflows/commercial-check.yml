name: Commercial model checks

on:
  pull_request:
    paths:
      - "app/business/**"
      - "app/page.tsx"
      - "lib/commercial-model.ts"
      - "tests/commercial-model.test.mjs"
      - ".github/workflows/commercial-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify unit economics
        run: node --experimental-strip-types --test tests/commercial-model.test.mjs
      - name: Check lint
        run: npm run lint
      - name: Build Next.js
        run: npm run build
