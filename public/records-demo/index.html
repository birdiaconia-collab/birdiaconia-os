 ];
 const state = {
  month:'2026-10',selectedDate:TODAY,recordFilter:'all',org:'버디아코니아 가상 시범센터',weekend:false,

  templates:[{name:'기본형',start:'09:00',end:'16:00',program:'생활체육·창작활동',memo:'월~금 동일 기본 일정'}, {name:'목요일 예외형',start:'09:00',end:'16:00',program:'원예·생활활동',memo:'목요일 10:00 등원',thuStart:'10:00'}],
  programs:['생활체육','창작활동','원예·생활활동','소록도 체험','지역 교류','일상생활 지원'],
  plans:[],
  records:[
   {id:'rec-1',pid:'A-01',date:TODAY,start:'10:30',end:'16:00',program:'생활체육',note:'컨디션 저하로 10시 30분 등원',status:'검토대기',staff:'제공인력 01'},
   {id:'rec-2',pid:'A-02',date:TODAY,start:'09:00',end:'16:00',program:'창작활동',note:'계획대로 참여함',status:'확정',staff:'운영자 데모'},
   {id:'rec-3',pid:'B-01',date:TODAY,start:'09:00',end:'15:00',program:'원예·생활활동',note:'개인 일정으로 1시간 조기 귀가',status:'확정',staff:'제공인력 02'},
   {id:'rec-4',pid:'C-02',date:TODAY,start:'',end:'',program:'',note:'개인 사유 결석',status:'확정',staff:'제공인력 03'}
  ],
  vouchers:[

  activity:[

 };

function load(){try{const raw=localStorage.getItem(STORE);if(raw){const s=JSON.parse(raw);if(s && Array.isArray(s.participants) && Array.isArray(s.records))return s}}catch(_){}return seed()}
let db=load(), active = (location.hash||'#dashboard').slice(1), toastTimer;
if(!pageInfo[active])active='dashboard';
function save(){try{localStorage.setItem(STORE,JSON.stringify(db))}catch(_){}}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function person(pid){return db.participants.find(p=>p.id===pid)}
function hours(start,end){if(!start||!end)return 0;const [h1,m1]=start.split(':').map(Number),[h2,m2]=end.split(':').map(Number);return Math.max(0,Math.round(((h2*60+m2)-(h1*60+m1))/60*10)/10)}
function hh(x){return `${Number(x||0).toFixed(1)}시간`}
function weekday(date){return ['일','월','화','수','목','금','토'][new Date(`${date}T12:00:00`).getDay()]}
function formatDate(date){return `${Number(date.slice(5,7))}월 ${Number(date.slice(8,10))}일 (${weekday(date)})`}
function templateFor(p,date){const t=db.templates.find(t=>t.name===p.template)||db.templates[0];const w=new Date(`${date}T12:00:00`).getDay();return {start:w===4&&t.thuStart?t.thuStart:t.start,end:t.end,program:t.program}}
function generatePlans(target,month){target.plans=target.plans.filter(x=>!x.date.startsWith(month+'-'));const yy=Number(month.slice(0,4)),mm=Number(month.slice(5,7))-1,end=new Date(yy,mm+1,0).getDate();for(let day=1;day<=end;day++){const date=`${month}-${String(day).padStart(2,'0')}`,w=new Date(yy,mm,day).getDay();if((w===0||w===6)&&!target.weekend)continue;for(const p of target.participants.filter(p=>p.status==='이용중')){const t=target.templates.find(t=>t.name===p.template)||target.templates[0];target.plans.push({pid:p.id,date,start:(w===4&&t.thuStart)?t.thuStart:t.start,end:t.end,program:t.program,group:p.group})}}}
function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3500)}
function pill(status){const classes={'확정':'ok','정상':'ok','일치':'ok','이용중':'ok','검토대기':'warn','확인 필요':'warn','미기록':'warn','불일치':'bad','기록없음':'bad','결석':'bad'};return `<span class="status-pill ${classes[status]||'info'}">${esc(status)}</span>`}
function actionBtn(text,action,kind='btn',extra=''){return `<button type="button" class="${kind}" data-action="${action}" ${extra}>${text}</button>`}
function stat(label,val,sub,ico){return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-icon">${ico}</div><div class="stat-value">${val}</div><div class="stat-sub">${sub}</div></div>`}
function panel(title,description,body,action=''){return `<section class="panel"><div class="panel-header"><div><h2 class="panel-heading">${title}</h2>${description?`<div class="panel-desc">${description}</div>`:''}</div>${action}</div>${body}</section>`}
function setHead(actions=''){const p=pageInfo[active];document.getElementById('breadcrumb').textContent=active==='dashboard'?'대시보드':p[1];document.getElementById('eyebrow').textContent=p[0];document.getElementById('page-title').textContent=p[1];document.getElementById('page-description').textContent=p[2];document.getElementById('heading-actions').innerHTML=actions;}
function render(){document.getElementById('nav').innerHTML=menu.map(m=>`<button type="button" class="nav-link ${active===m.id?'active':''}" data-action="navigate" data-page="${m.id}"><span class="icon">${glyph[m.icon]}</span><span>${m.label}</span>${m.id==='records'&&db.records.some(r=>r.status==='검토대기')?'<span class="count">'+db.records.filter(r=>r.status==='검토대기').length+'</span>':''}</button>`).join('');const views={dashboard:dashboard,participants:participants,templates:templates,assignments:assignments,plans:plans,records:records,voucher:voucher,reports:reports,mobile:mobile,settings:settings};setHead();document.getElementById('view').innerHTML=views[active]();save()}
function navigate(page){if(!pageInfo[page])return;active=page;location.hash=page;render();window.scrollTo({top:0,behavior:'instant'})}
function dashboard(){const activeP=db.participants.filter(p=>p.status==='이용중').length,pending=db.records.filter(r=>r.status==='검토대기'),exceptions=compareVouchers().filter(v=>v.status!=='일치');setHead(actionBtn('＋ 현장 기록하기','go-mobile','btn btn-primary'));
 const row=db.activity.slice().reverse().map((a,i)=>`<div class="activity-line"><span class="activity-dot">${['⇄','✓','↗','▦'][i%4]}</span><div class="activity-details"><b>${esc(a.title)}</b><small>${esc(a.detail)}</small></div><span class="activity-time">${esc(a.time)}</span></div>`).join('');
 return `<div class="stats-grid">${stat('현재 이용자',`${activeP}<small style="font-size:15px;font-weight:500;color:#9ba6ae"> 명</small>`,'A/B/C반 · 가상 이용자','♙')}${stat('10월 활동 계획',`${db.plans.filter(p=>p.date.startsWith(db.month)).length}<small style="font-size:15px;font-weight:500;color:#9ba6ae"> 건</small>`,'월간 일괄 생성된 일정','▦')}${stat('검토 대기',`${pending.length}<small style="font-size:15px;font-weight:500;color:#9ba6ae"> 건</small>`,'<span class="up">현장 기록 확인 요청</span>','▧')}${stat('대조 확인 필요',`${exceptions.length}<small style="font-size:15px;font-weight:500;color:#9ba6ae"> 건</small>`,'결제·활동시간 차이 포함','◎')}</div>
 <div class="layout-two"><div>${panel('오늘의 운영 타임라인',`${formatDate(TODAY)} · 각 이벤트는 확인 및 기록 대상으로 연결됩니다.`,row,`<button class="text-link" data-action="navigate" data-page="records">기록 확인 ↗</button>`)}<div class="steps-row"><span class="step active">① 기본 등록</span><span class="step-arrow">→</span><span class="step active">② 계획 자동 생성</span><span class="step-arrow">→</span><span class="step active">③ 현장 기록</span><span class="step-arrow">→</span><span class="step">④ 대조·출력</span></div></div><div>${panel('운영 상태', '한 번 입력된 데이터를 반복 활용합니다.', `<div class="metric-row"><span class="metric-label">계획 수립</span><span class="progress"><b style="width:100%"></b></span><span class="metric-number">100%</span></div><div class="metric-row"><span class="metric-label">기록 확정</span><span class="progress"><b style="width:${Math.round(db.records.filter(r=>r.status==='확정').length/Math.max(1,db.records.length)*100)}%"></b></span><span class="metric-number">${Math.round(db.records.filter(r=>r.status==='확정').length/Math.max(1,db.records.length)*100)}%</span></div><div class="metric-row"><span class="metric-label">대조 일치</span><span class="progress"><b style="width:${Math.round(compareVouchers().filter(x=>x.status==='일치').length/Math.max(1,db.vouchers.length)*100)}%"></b></span><span class="metric-number">${Math.round(compareVouchers().filter(x=>x.status==='일치').length/Math.max(1,db.vouchers.length)*100)}%</span></div><div class="soft-callout"><strong>✧ 자동화는 현장의 예외부터</strong><p>같은 입력을 반복하는 대신, 계획과 달라진 사항만 기록하고 관리자가 확정합니다.</p></div>`)}${panel('확인해야 할 업무', '', `<div class="task-list"><div class="task-card alert"><div class="task-content"><b>현장 기록 ${pending.length}건 확인</b><p>등원 시각 등 계획과 다른 변경사항</p></div>${actionBtn('바로가기 ↗','go-records','btn btn-sm')}</div><div class="task-card alert"><div class="task-content"><b>결제 대조 ${exceptions.length}건 점검</b><p>가상 바우처 결제시간과 활동시간 대조</p></div>${actionBtn('대조하기 ↗','go-voucher','btn btn-sm')}</div></div>`)}</div></div>`}
function participants(){setHead(actionBtn('⊞ 엑셀 붙여넣기','bulk-participants','btn')+actionBtn('＋ 이용자 등록','add-participant','btn btn-primary'));return `<div class="toolbar"><div class="toolbar-left"><input class="search-input" placeholder="이용자 코드 또는 이름 검색" id="search-participants" aria-label="이용자 검색"/><select id="filter-group" class="select-sm"><option value="">전체 반</option><option>A반</option><option>B반</option><option>C반</option></select></div><span class="small-muted">실제 개인정보가 아닌 가상 코드로만 시연합니다.</span></div><div class="table-wrap"><table><thead><tr><th>이용자</th><th>소속</th><th>월 배정시간</th><th>하루 계획틀</th><th>이용상태</th><th>관리</th></tr></thead><tbody id="people-tbody">${participantRows(db.participants)}</tbody></table></div>${panel('입력은 한 번, 연결은 자동으로', '기본 정보를 등록하면 매칭·계획·기록·통계에 자동 반영됩니다.', '<div class="steps-row"><span class="step active">이용자 등록</span><span class="step-arrow">→</span><span class="step">반·담당 배정</span><span class="step-arrow">→</span><span class="step">월간 계획</span><span class="step-arrow">→</span><span class="step">현장 기록</span></div>')}`}
function participantRows(items){return items.map((p,i)=>`<tr><td><div class="cell-title"><span class="user-initial ${p.group==='B반'?'orange':p.group==='C반'?'blue':''}">${esc(p.id)}</span><div><strong>${esc(p.name)}</strong><span class="subline">ID ${esc(p.id)} · 데모</span></div></div></td><td>${esc(p.group)}</td><td><strong>${p.hours}</strong> 시간</td><td>${esc(p.template)}</td><td>${pill(p.status)}</td><td><button class="mini-button" data-action="edit-participant" data-id="${esc(p.id)}">수정</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">일치하는 이용자가 없습니다.</td></tr>'}
function templates(){setHead(actionBtn('＋ 계획틀 추가','add-template','btn btn-primary'));return `<div class="banner"><div class="banner-icon">◷</div><div><strong>기본 계획틀을 만들면 모든 평일 일정을 자동 생성할 수 있습니다.</strong><p>목요일 송영 제외와 같이 요일별 일정이 다른 이용자에게 개별 계획틀을 지정합니다.</p></div></div><div class="layout-equal">${db.templates.map((t,i)=>panel(`${esc(t.name)} ${i===0?'<span class="status-pill ok">기본</span>':''}`,esc(t.memo),`<div class="key-value"><span>등원 예정</span><b>${esc(t.start)}</b></div><div class="key-value"><span>귀가 예정</span><b>${esc(t.end)}</b></div><div class="key-value"><span>기본 프로그램</span><b>${esc(t.program)}</b></div>${t.thuStart?`<div class="key-value"><span>목요일 예외</span><b>등원 ${esc(t.thuStart)}</b></div>`:''}<div style="margin-top:20px">${actionBtn('계획틀 수정','edit-template','btn btn-sm',`data-id="${i}"`)}</div>`)).join('')}</div><div style="margin-top:18px">${panel('설계 원칙', '계획은 기본값입니다. 실제 활동과 다르면 그 차이를 별도 기록합니다.', `<div class="steps-row"><span class="step active">기본 시간표</span><span class="step-arrow">→</span><span class="step active">요일별 예외</span><span class="step-arrow">→</span><span class="step">이용자 배정</span><span class="step-arrow">→</span><span class="step">월간 계획 생성</span></div>`)}</div>`}
function assignments(){setHead(actionBtn('월간 계획으로 이동 ↗','go-plans','btn btn-primary'));return `<div class="banner"><div class="banner-icon">⌘</div><div><strong>반별 담당자와 개별 계획틀을 연결합니다.</strong><p>가상 제공 인력은 역할만 표시하며, 인증·권한 검증은 이 데모에 포함하지 않았습니다.</p></div></div><div class="layout-equal">${['A반','B반','C반'].map(g=>panel(`${g} <span class="status-pill info">${db.participants.filter(p=>p.group===g).length}명</span>`, '반 담당자는 선택 후 즉시 반영됩니다.',`<div class="key-value"><span>담당 제공인력</span><b><select class="select-sm" data-role="staff" data-group="${g}">${['운영자 데모','제공인력 01','제공인력 02','제공인력 03'].map(s=>`<option ${db.staff[g]===s?'selected':''}>${s}</option>`).join('')}</select></b></div>${db.participants.filter(p=>p.group===g).map(p=>`<div class="key-value"><span>${esc(p.name)}</span><b><select class="select-sm" data-role="template" data-pid="${esc(p.id)}">${db.templates.map(t=>`<option ${t.name===p.template?'selected':''}>${esc(t.name)}</option>`).join('')}</select></b></div>`).join('')}`)).join('')}</div>`}
function plans(){setHead(actionBtn('↻ 월간 계획 생성','generate-plan','btn btn-primary'));const [year,month]=db.month.split('-').map(Number),firstDay=new Date(year,month-1,1).getDay(),end=new Date(year,month,0).getDate(),grid=[];for(let n=0;n<Math.ceil((firstDay+end)/7)*7;n++){const day=n-firstDay+1;if(day<1||day>end){grid.push('<div class="calendar-day inactive"></div>');continue}const date=`${db.month}-${String(day).padStart(2,'0')}`,items=db.plans.filter(p=>p.date===date),w=new Date(year,month-1,day).getDay();grid.push(`<div class="calendar-day ${date===TODAY?'today':''} ${w===0||w===6?'inactive':''}"><b>${day}</b>${items.length?`<span class="tiny-chip ${date===TODAY?'alert':''}">${items.length}명 · 일정 생성</span>`:''}</div>`)}return `<div class="banner"><div class="banner-icon">▦</div><div><strong>${db.month.replace('-','년 ')}월간 계획이 ${db.plans.filter(x=>x.date.startsWith(db.month)).length}건 준비되어 있습니다.</strong><p>평일 운영·이용자 계획틀을 기준으로 자동 생성하며, 실제 기록은 별도로 보존됩니다.</p></div><button class="btn" data-action="go-templates">계획틀 확인 ↗</button></div><div class="toolbar"><div class="toolbar-left"><select id="month-select" class="select-sm"><option value="2026-10" ${db.month==='2026-10'?'selected':''}>2026년 10월</option><option value="2026-11" ${db.month==='2026-11'?'selected':''}>2026년 11월</option><option value="2026-12" ${db.month==='2026-12'?'selected':''}>2026년 12월</option></select><span class="small-muted">기본 계획틀 적용 · 평일 운영</span></div><span class="status-pill ok">자동 생성 준비됨</span></div>${panel(`${month}월 활동 달력`, '색상으로 계획이 생성된 날짜를 표시합니다.',`<div class="grid-7">${['일','월','화','수','목','금','토'].map(d=>`<div class="calendar-head">${d}</div>`).join('')}${grid.join('')}</div>`)}<div style="margin-top:18px">${panel('계획 생성 규칙', '', `<div class="steps-row"><span class="step active">이용자 및 담당자</span><span class="step-arrow">→</span><span class="step active">요일별 계획틀</span><span class="step-arrow">→</span><span class="step active">월간 계획 생성</span><span class="step-arrow">→</span><span class="step">현장 변경사항 기록</span></div>`)}</div>`}
function records(){const list=db.records.filter(r=>r.date===db.selectedDate&&(db.recordFilter==='all'||r.status===db.recordFilter));const pending=db.records.filter(r=>r.status==='검토대기');setHead(actionBtn('＋ 현장 기록 등록','add-record','btn btn-primary')+actionBtn('직원 모바일 보기 ↗','go-mobile','btn'));return `<div class="toolbar"><div class="toolbar-left"><input type="date" id="record-date" class="select-sm" value="${db.selectedDate}"/><div class="filter-tabs"><button class="filter-tab ${db.recordFilter==='all'?'active':''}" data-action="record-filter" data-filter="all">전체</button><button class="filter-tab ${db.recordFilter==='검토대기'?'active':''}" data-action="record-filter" data-filter="검토대기">검토 대기</button><button class="filter-tab ${db.recordFilter==='확정'?'active':''}" data-action="record-filter" data-filter="확정">확정</button></div></div><span class="small-muted">날짜별 현장 기록 · 현재 ${list.length}건</span></div>${pending.length?`<div class="banner"><div class="banner-icon">!</div><div><strong>현장 기록 ${pending.length}건이 관리자 확인을 기다립니다.</strong><p>계획 대비 변경사항은 자동으로 표시되고, 승인 전에는 미확정 상태로 남습니다.</p></div></div>`:''}<div class="table-wrap"><table><thead><tr><th>이용자</th><th>출결 기록</th><th>제공 프로그램</th><th>사유·관찰내용</th><th>상태</th><th>조치</th></tr></thead><tbody>${list.map(r=>{const p=person(r.pid),t=p?templateFor(p,r.date):{start:'',end:''};const changed=r.start!==t.start||r.end!==t.end;return `<tr><td><strong>${esc(p?.name||r.pid)}</strong><span class="subline">${esc(p?.group||'')}</span></td><td><strong>${r.start?`${esc(r.start)} ~ ${esc(r.end)}`:'결석'}</strong>${changed?'<span class="subline" style="color:#c98c46">계획과 차이 있음</span>':'<span class="subline">계획과 동일</span>'}</td><td>${esc(r.program||'—')}</td><td>${esc(r.note)}</td><td>${pill(r.status)}</td><td><div class="table-actions">${actionBtn('수정','edit-record','btn btn-sm',`data-id="${r.id}"`)}${r.status==='검토대기'?actionBtn('확정','approve-record','btn btn-primary btn-sm',`data-id="${r.id}"`):''}</div></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">해당 조건의 기록이 없습니다.</td></tr>'}</tbody></table></div><div style="margin-top:18px">${panel('기록과 승인 이력', '검토 상태와 입력 결과를 분리하여 원본의 맥락을 유지합니다.', `<div class="key-value"><span>전체 등록 기록</span><b>${db.records.length}건</b></div><div class="key-value"><span>확정된 기록</span><b>${db.records.filter(r=>r.status==='확정').length}건</b></div><div class="key-value"><span>관리자 검토 대기</span><b>${pending.length}건</b></div>`)}</div>`}
function compareVouchers(){return db.vouchers.map(v=>{const r=db.records.find(r=>r.pid===v.pid&&r.date===v.date);const actual=r?hours(r.start,r.end):null;let status='기록없음',description='대조할 현장 기록이 없습니다.';if(r){if(r.status!=='확정'){status='확인 필요';description='현장 기록이 관리자 검토 대기 상태입니다.'}else if(Math.abs(v.hours-actual)>.001){status='불일치';description=`결제 ${hh(v.hours)} / 확정 활동 ${hh(actual)} — 차이 ${hh(Math.abs(v.hours-actual))}`}else{status='일치';description='확정된 활동시간과 결제시간이 일치합니다.'}}return {...v,status,description,actual}})}
function voucher(){const data=compareVouchers(),matching=data.filter(x=>x.status==='일치').length,mismatch=data.filter(x=>x.status==='불일치').length,pending=data.filter(x=>x.status==='확인 필요').length,missing=data.filter(x=>x.status==='기록없음').length;setHead(actionBtn('⊞ CSV 데이터 가져오기','import-voucher','btn')+actionBtn('샘플 대조 실행','sample-voucher','btn btn-primary'));return `<div class="banner"><div class="banner-icon">⇄</div><div><strong>결제 명세와 실제 활동을 자동 비교합니다.</strong><p>영상의 바우처 대조 구조를 참고했습니다. 현재는 <b>가상 CSV</b>로만 시험하며 공식 결제 시스템과 연결되지 않습니다.</p></div></div><div class="stats-grid">${stat('가상 결제 건수',data.length,'CSV 등록 건수','▤')}${stat('정상 일치',matching,'확정 활동기록과 일치','✓')}${stat('시간 불일치',mismatch,'차이 사유 확인 필요','!')}${stat('검토대기·기록없음',pending+missing,'확인/보완이 필요한 건','◷')}</div>${panel('결제 대조 결과', '결제시간과 실제 활동시간을 비교하며, 승인되지 않은 기록은 정상으로 취급하지 않습니다.',data.map(v=>`<div class="voucher-match-row ${v.status==='일치'?'ok':v.status==='불일치'?'bad':'warn'}"><div><div class="task-main"><strong>${esc(person(v.pid)?.name||v.pid)} <span class="small-muted">· ${esc(v.date)}</span></strong>${pill(v.status)}</div><small>${esc(v.description)}</small></div><button class="mini-button" data-action="go-records">기록 확인 ↗</button></div>`).join(''))}<div style="margin-top:18px">${panel('대조 규칙', '현장 기록이 확정되기 전에는 결제 일치를 확정하지 않습니다.', `<div class="steps-row"><span class="step active">CSV 가져오기</span><span class="step-arrow">→</span><span class="step active">이용자·날짜 매칭</span><span class="step-arrow">→</span><span class="step active">시간 차이 탐지</span><span class="step-arrow">→</span><span class="step">관리자 확인</span></div>`)}</div>`}
function reports(){const approved=db.records.filter(r=>r.status==='확정'),total=approved.reduce((a,r)=>a+hours(r.start,r.end),0),comp=compareVouchers();setHead(actionBtn('↓ 활동기록 CSV 내려받기','export-csv','btn')+actionBtn('인쇄/PDF 저장','print-report','btn btn-primary'));return `<div class="month-row">${[{label:'이용자 수',val:db.participants.length,unit:'명'},{label:'생성된 월간 계획',val:db.plans.filter(r=>r.date.startsWith(db.month)).length,unit:'건'},{label:'승인된 현장 기록',val:approved.length,unit:'건'},{label:'누적 서비스 시간',val:total.toFixed(1),unit:'시간'},{label:'결제 일치',val:comp.filter(v=>v.status==='일치').length,unit:'건'}].map(m=>`<div class="month-card"><small>${m.label}</small><b>${m.val}<span style="font-size:12px;color:#9babb7;margin-left:4px">${m.unit}</span></b></div>`).join('')}</div><div style="margin-top:22px">${panel('자동 보고서 미리보기','실제 운영 서식이 아닌 기능 검증용 시연 양식입니다.',`<div class="report-preview"><h2>월간 서비스 활동 기록 요약</h2><div class="report-meta">${esc(db.org)} · ${esc(db.month)} · 가상 데이터</div><div class="key-value"><span>대상 인원</span><b>${db.participants.length}명</b></div><div class="key-value"><span>승인된 활동기록</span><b>${approved.length}건 / ${hh(total)}</b></div><div class="key-value"><span>검토 대기</span><b>${db.records.filter(r=>r.status==='검토대기').length}건</b></div><h3 style="margin-top:28px;font-size:13px">개별 활동 기록</h3><table><thead><tr><th>이용자</th><th>활동일</th><th>제공시간</th><th>활동내용</th><th>검토</th></tr></thead><tbody>${db.records.map(r=>`<tr><td>${esc(r.pid)}</td><td>${esc(r.date)}</td><td>${hh(hours(r.start,r.end))}</td><td>${esc(r.program||'결석')}</td><td>${esc(r.status)}</td></tr>`).join('')}</tbody></table><div class="report-sign">검토: 운영자 데모 <span class="report-stamp">시연용</span></div></div>`)}</div>`}

function popup(title,body,buttons=''){document.getElementById('modal').innerHTML=`<h2>${title}</h2>${body}<div class="modal-actions">${buttons||`${actionBtn('닫기','close-modal','btn')}`}</div>`;document.getElementById('modal-overlay').classList.remove('hidden')}
function closeModal(){document.getElementById('modal-overlay').classList.add('hidden')}
function participantModal(id){const p=id?person(id):{id:'',name:'',group:'A반',hours:132,status:'이용중',template:db.templates[0].name};popup(id?'이용자 정보 수정':'새 이용자 등록',`<div class="field-grid"><div><label class="field-label">가상 이용자 코드</label><input class="field" id="p-id" value="${esc(p.id)}" ${id?'disabled':''} placeholder="D-01"/></div><div><label class="field-label">표시 이름</label><input class="field" id="p-name" value="${esc(p.name)}" placeholder="체험 이용자 D-01"/></div><div><label class="field-label">소속 반</label><select class="field" id="p-group">${['A반','B반','C반'].map(g=>`<option ${p.group===g?'selected':''}>${g}</option>`).join('')}</select></div><div><label class="field-label">월 배정시간</label><input type="number" class="field" id="p-hours" min="0" max="744" value="${p.hours}"/></div><div><label class="field-label">계획틀</label><select class="field" id="p-template">${db.templates.map(t=>`<option ${p.template===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div><label class="field-label">이용상태</label><select class="field" id="p-status"><option ${p.status==='이용중'?'selected':''}>이용중</option><option ${p.status==='종료'?'selected':''}>종료</option></select></div></div><p class="small-note">실제 이름, 연락처, 장애 관련 정보는 입력하지 마세요. 이 화면은 가상 데이터 시연 전용입니다.</p>`,actionBtn('취소','close-modal','btn')+actionBtn('저장','save-participant','btn btn-primary',`data-original="${esc(id||'')}"`))}
function templateModal(i){const t=db.templates[i]||{name:'',start:'09:00',end:'16:00',program:db.programs[0],memo:'',thuStart:''};popup(i===undefined?'계획틀 추가':'계획틀 수정',`<div class="field-grid"><div class="field-full"><label class="field-label">계획틀 이름</label><input id="t-name" class="field" value="${esc(t.name)}"/></div><div><label class="field-label">등원 예정</label><input id="t-start" type="time" class="field" value="${esc(t.start)}"/></div><div><label class="field-label">하원 예정</label><input id="t-end" type="time" class="field" value="${esc(t.end)}"/></div><div><label class="field-label">목요일 예외 등원 (선택)</label><input id="t-thu" type="time" class="field" value="${esc(t.thuStart||'')}"/></div><div><label class="field-label">기본 프로그램</label><select id="t-program" class="field">${db.programs.map(p=>`<option ${p===t.program?'selected':''}>${esc(p)}</option>`).join('')}</select></div><div class="field-full"><label class="field-label">운영 메모</label><input id="t-memo" class="field" value="${esc(t.memo)}"/></div></div>`,actionBtn('취소','close-modal','btn')+actionBtn('저장','save-template','btn btn-primary',`data-index="${i===undefined?'':i}"`))}
function recordModal(id){const r=id?db.records.find(x=>x.id===id):{pid:db.participants[0]?.id||'',date:db.selectedDate,start:'09:00',end:'16:00',program:db.programs[0],note:'',status:'검토대기'};popup(id?'활동 기록 수정':'현장 기록 새로 등록',`<div class="field-grid"><div><label class="field-label">이용자</label><select id="r-pid" class="field">${db.participants.map(p=>`<option value="${esc(p.id)}" ${p.id===r.pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div><label class="field-label">활동 날짜</label><input type="date" id="r-date" class="field" value="${esc(r.date)}"/></div><div><label class="field-label">실제 등원</label><input type="time" id="r-start" class="field" value="${esc(r.start)}"/></div><div><label class="field-label">실제 하원</label><input type="time" id="r-end" class="field" value="${esc(r.end)}"/></div><div class="field-full"><label class="field-label">실제 프로그램</label><select id="r-program" class="field"><option value="">결석</option>${db.programs.map(p=>`<option ${p===r.program?'selected':''}>${esc(p)}</option>`).join('')}</select></div><div class="field-full"><label class="field-label">변경 사유 및 관찰내용</label><textarea id="r-note" class="field">${esc(r.note)}</textarea></div></div>`,actionBtn('취소','close-modal','btn')+actionBtn('검토 요청으로 저장','save-record','btn btn-primary',`data-id="${esc(id||'')}"`))}
function importVoucherModal(){popup('가상 결제 CSV 일괄 가져오기',`<p class="instruction-text">CSV 또는 엑셀에서 복사한 표를 붙여넣으세요. 열은 <b>이용자코드, 날짜, 결제시간</b> 순서입니다. 실제 결제 자료는 입력하지 마세요.</p><textarea id="voucher-paste" class="field" style="height:190px;font-family:monospace">A-01,2026-10-21,7\nA-02,2026-10-21,7\nB-01,2026-10-21,7\nC-01,2026-10-21,6\nC-02,2026-10-21,7</textarea><p class="small-note">헤더가 있는 CSV도 자동으로 건너뜁니다. 불일치 결과는 관리자 화면에서 확인합니다.</p>`,actionBtn('취소','close-modal','btn')+actionBtn('가상 결제 자료 반영','apply-voucher','btn btn-primary'))}
function bulkParticipantModal(){popup('엑셀 표를 붙여넣어 일괄 등록',`<p class="instruction-text">각 행에 <b>코드 / 표시 이름 / 반 / 월 배정시간</b>을 탭 또는 쉼표로 구분하여 입력하세요.</p><textarea id="bulk-paste" class="field" style="height:140px" placeholder="D-01&#9;체험 이용자 D-01&#9;A반&#9;132"></textarea><p class="small-note">기존 코드와 중복되면 추가하지 않습니다. 실명 데이터 업로드는 금지합니다.</p>`,actionBtn('취소','close-modal','btn')+actionBtn('일괄 등록','apply-bulk','btn btn-primary'))}
function byId(id){return document.getElementById(id)}
function formValue(id){return byId(id)?.value?.trim()||''}
function exportCsv(){const rows=[['이용자코드','활동일','등원','하원','활동시간','프로그램','관찰내용','검토상태'],...db.records.map(r=>[r.pid,r.date,r.start,r.end,hours(r.start,r.end),r.program,r.note,r.status])];const csv='\ufeff'+rows.map(row=>row.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download='Birdiaconia_활동기록_가상데이터.csv';a.click();setTimeout(()=>URL.revokeObjectURL(href),1500);notify('가상 활동기록 CSV를 내려받았습니다.')}
function guide(){popup('버디아코니아 기록 운영실 — 사용 안내',`<div class="highlight-card"><h2>기록은 한 번,<br>활용은 여러 번.</h2><p>이 프로그램은 월간 계획을 자동 생성하고, 현장에서는 달라진 사실만 입력하도록 구성한 테스트 버전입니다.</p></div><ol class="clean-list"><li>이용자 정보를 등록하고 반·담당자를 연결합니다.</li><li>요일별 계획틀을 만들어 월간 일정을 생성합니다.</li><li>직원 모바일 화면에서 출결·관찰 변경사항을 남깁니다.</li><li>관리자가 현장 기록을 확인하고 확정합니다.</li><li>가상 결제 명세와 대조하고 보고서를 출력합니다.</li></ol><p class="small-note">중요: 서버 저장, 실명 정보 처리, 실제 바우처 정산 기능은 구현되지 않았습니다.</p>`)}
const actions={
 'navigate':el=>navigate(el.dataset.page),
 'go-mobile':()=>navigate('mobile'),'go-records':()=>navigate('records'),'go-plans':()=>navigate('plans'),'go-templates':()=>navigate('templates'),'go-voucher':()=>navigate('voucher'),
 'add-participant':()=>participantModal(),'edit-participant':el=>participantModal(el.dataset.id),
 'save-participant':el=>{const id=formValue('p-id').toUpperCase(),name=formValue('p-name'),hoursNum=Number(formValue('p-hours'));if(!/^[A-Z0-9_-]{2,20}$/.test(id)||!name||!Number.isFinite(hoursNum)||hoursNum<0||hoursNum>744){notify('코드, 이름, 배정시간을 확인하세요.');return}const orig=el.dataset.original;if(!orig&&db.participants.some(p=>p.id===id)){notify('같은 이용자 코드가 이미 등록되어 있습니다.');return}const next={id,name,group:formValue('p-group'),hours:hoursNum,template:formValue('p-template'),status:formValue('p-status')};if(orig)Object.assign(person(orig),next);else db.participants.push(next);closeModal();render();notify('가상 이용자 정보가 반영되었습니다.')},
 'bulk-participants':()=>bulkParticipantModal(),'apply-bulk':()=>{let count=0;for(const line of formValue('bulk-paste').split('\n')){const arr=line.split(/[\t,]/).map(x=>x.trim());if(arr.length<4)continue;const [id,name,group,num]=arr;if(!/^[A-Z0-9_-]{2,20}$/.test(id)||!name||!['A반','B반','C반'].includes(group)||db.participants.some(p=>p.id===id))continue;db.participants.push({id,name,group,hours:Math.max(0,Number(num)||0),status:'이용중',template:db.templates[0].name});count++}closeModal();render();notify(`${count}명의 가상 이용자를 등록했습니다.`)},
 'add-template':()=>templateModal(),'edit-template':el=>templateModal(Number(el.dataset.id)),'save-template':el=>{const name=formValue('t-name'),start=formValue('t-start'),end=formValue('t-end'),i=el.dataset.index===''?undefined:Number(el.dataset.index);if(!name||!start||!end||hours(start,end)<=0){notify('계획틀 이름과 시간을 확인하세요.');return}if(i===undefined&&db.templates.some(t=>t.name===name)){notify('같은 이름의 계획틀이 있습니다.');return}const t={name,start,end,program:formValue('t-program'),memo:formValue('t-memo'),thuStart:formValue('t-thu')};if(i===undefined)db.templates.push(t);else{const old=db.templates[i].name;db.templates[i]=t;if(old!==name)db.participants.forEach(p=>{if(p.template===old)p.template=name})}closeModal();render();notify('하루 계획틀이 저장되었습니다.')},
 'generate-plan':()=>{generatePlans(db,db.month);db.activity.push({time:'오늘',title:'월간 활동계획 재생성',detail:`${db.month} · ${db.plans.filter(p=>p.date.startsWith(db.month)).length}건`});render();notify(`${db.month} 활동계획을 다시 생성했습니다.`)},
 'record-filter':el=>{db.recordFilter=el.dataset.filter;render()},'add-record':()=>recordModal(),'edit-record':el=>recordModal(el.dataset.id),
 'save-record':el=>{const pid=formValue('r-pid'),date=formValue('r-date'),start=formValue('r-start'),end=formValue('r-end');if(!pid||!date||((start||end)&&(!start||!end||hours(start,end)<=0))){notify('이용자, 날짜와 시간을 확인하세요. 결석은 시간을 모두 비우세요.');return}const r={id:el.dataset.id||`rec-${Date.now()}`,pid,date,start,end,program:formValue('r-program'),note:formValue('r-note'),status:'검토대기',staff:'운영자 데모'};const i=db.records.findIndex(x=>x.id===r.id);if(i>=0)db.records[i]=r;else db.records.push(r);db.selectedDate=date;db.activity.push({time:'오늘',title:'현장 기록 등록',detail:`${pid} · 관리자 검토 요청`});closeModal();render();notify('현장 기록을 저장했습니다. 관리자 검토 대기 상태입니다.')},
 'approve-record':el=>{const r=db.records.find(x=>x.id===el.dataset.id);if(r){r.status='확정';db.activity.push({time:'오늘',title:'활동 기록 검토 완료',detail:`${r.pid} · 승인`});render();notify(`${r.pid} 활동기록이 확정되었습니다.`)}},
 'submit-mobile':()=>{const pid=formValue('mobile-pid'),start=formValue('mobile-start'),end=formValue('mobile-end');if(!pid||!start||!end||hours(start,end)<=0){notify('등·하원 시간을 확인하세요.');return}let r=db.records.find(x=>x.pid===pid&&x.date===TODAY);const rec={id:r?.id||`rec-${Date.now()}`,pid,date:TODAY,start,end,program:formValue('mobile-program'),note:formValue('mobile-note'),status:'검토대기',staff:'제공인력 모바일'};if(r)Object.assign(r,rec);else db.records.push(rec);db.activity.push({time:'오늘',title:'모바일 기록 수신',detail:`${pid} · 관리자 확인 요청`});render();notify('기록 전송 완료! 관리자 운영실의 검토 대기에 반영했습니다.')},
 'import-voucher':()=>importVoucherModal(),'sample-voucher':()=>{db.vouchers=seed().vouchers;render();notify('가상 바우처 결제내역 5건을 대조했습니다.')},
 'apply-voucher':()=>{const rows=[];for(const line of formValue('voucher-paste').split('\n')){const arr=line.split(/[\t,]/).map(v=>v.replace(/^"|"$/g,'').trim());if(arr.length<3)continue;const [pid,date,value]=arr;const amount=Number(value);if(!person(pid)||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(amount)||amount<0||amount>24)continue;rows.push({pid,date,hours:amount})}if(!rows.length){notify('유효한 가상 결제 데이터가 없습니다.');return}db.vouchers=rows;closeModal();render();notify(`${rows.length}건을 가져와 자동으로 대조했습니다.`)},
 'export-csv':()=>exportCsv(),'print-report':()=>window.print(),
 'add-program':()=>popup('프로그램 분류 추가','<label class="field-label">새 프로그램명</label><input id="new-program" class="field" placeholder="예: 지역사회 체험"/>',actionBtn('취소','close-modal','btn')+actionBtn('추가','save-program','btn btn-primary')),
 'save-program':()=>{const p=formValue('new-program');if(!p||db.programs.includes(p)){notify('프로그램명을 확인하세요.');return}db.programs.push(p);closeModal();render();notify('프로그램이 추가되었습니다.')},
 'reset-demo':()=>popup('가상 시연 데이터 초기화','<p class="instruction-text">브라우저에 저장된 현재 데모 내용이 모두 초기화됩니다. 실제 운영 서버의 데이터는 사용하지 않습니다.</p>',actionBtn('취소','close-modal','btn')+actionBtn('초기화','confirm-reset','btn btn-primary')),
 'confirm-reset':()=>{db=seed();closeModal();render();notify('가상 데모 데이터가 초기화되었습니다.')},
 'close-modal':()=>closeModal(), 'help':()=>guide()
};
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el){const fn=actions[el.dataset.action];if(fn)fn(el)}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='record-date'){db.selectedDate=el.value;render()}if(el.id==='month-select'){db.month=el.value;render()}if(el.dataset.role==='staff'){db.staff[el.dataset.group]=el.value;save();notify('담당 인력이 변경되었습니다.')}if(el.dataset.role==='template'){const p=person(el.dataset.pid);if(p){p.template=el.value;save();notify('개별 계획틀을 적용했습니다.')}}if(el.id==='filter-group'){const q=byId('search-participants')?.value.toLowerCase()||'';byId('people-tbody').innerHTML=participantRows(db.participants.filter(p=>(!el.value||p.group===el.value)&&(`${p.id} ${p.name}`).toLowerCase().includes(q)))}});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='search-participants'){const g=byId('filter-group').value,q=el.value.toLowerCase();byId('people-tbody').innerHTML=participantRows(db.participants.filter(p=>(!g||p.group===g)&&(`${p.id} ${p.name}`).toLowerCase().includes(q)))}});
byId('btn-guide').addEventListener('click',guide);
byId('modal-overlay').addEventListener('click',event=>{if(event.target.id==='modal-overlay')closeModal()});
window.addEventListener('hashchange',()=>{const page=(location.hash||'#dashboard').slice(1);if(pageInfo[page]&&active!==page){active=page;render()}});
render();
window.BirdiaDemo={go:navigate,db:()=>db,reset:()=>{db=seed();render()},setRecordDate:d=>{db.selectedDate=d;render()}};
})();

</script>
</body>
</html>
